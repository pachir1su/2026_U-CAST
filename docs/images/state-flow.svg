<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" width="1100" height="720" font-family="Malgun Gothic, Noto Sans KR, sans-serif">
  <title>멈춰 ! 독립 채널 동작 흐름도</title>
  <rect width="1100" height="720" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <text x="36" y="48" font-size="27" font-weight="bold" fill="#111827">멈춰 ! — 독립 채널 동작 흐름도</text>
  <text x="36" y="78" font-size="15" fill="#475569">시작 IR · 끝 IR · LED 스트립 한 세트가 자기 채널만 제어합니다. 두 채널은 동시에 작동할 수 있습니다.</text>

  <!-- channel 1 -->
  <rect x="45" y="120" width="480" height="400" rx="16" fill="#f8fafc" stroke="#2563eb" stroke-width="3"/>
  <text x="285" y="155" font-size="22" font-weight="bold" text-anchor="middle" fill="#1e3a8a">채널 1</text>
  <rect x="85" y="190" width="180" height="76" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="175" y="220" font-size="16" font-weight="bold" text-anchor="middle" fill="#1e40af">시작 IR 1 · D8</text>
  <text x="175" y="244" font-size="13" text-anchor="middle" fill="#1d4ed8">감지 → 채널 1 시작</text>
  <path d="M265 228 H335" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="340" y="175" width="145" height="108" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="412" y="208" font-size="16" font-weight="bold" text-anchor="middle" fill="#991b1b">스트립 1 · D4</text>
  <text x="412" y="233" font-size="14" text-anchor="middle" fill="#b91c1c">빨간색 점멸</text>
  <text x="412" y="257" font-size="13" text-anchor="middle" fill="#b91c1c">300ms ON↔OFF</text>
  <path d="M412 283 V340" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="315" y="345" width="195" height="76" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="412" y="375" font-size="16" font-weight="bold" text-anchor="middle" fill="#166534">끝 IR 1 · D10</text>
  <text x="412" y="399" font-size="13" text-anchor="middle" fill="#15803d">감지 → 채널 1 종료</text>
  <text x="285" y="475" font-size="14" text-anchor="middle" fill="#475569">채널 2 상태와 무관하게 시작·종료</text>

  <!-- channel 2 -->
  <rect x="575" y="120" width="480" height="400" rx="16" fill="#f8fafc" stroke="#7c3aed" stroke-width="3"/>
  <text x="815" y="155" font-size="22" font-weight="bold" text-anchor="middle" fill="#5b21b6">채널 2</text>
  <rect x="615" y="190" width="180" height="76" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="705" y="220" font-size="16" font-weight="bold" text-anchor="middle" fill="#5b21b6">시작 IR 2 · D9</text>
  <text x="705" y="244" font-size="13" text-anchor="middle" fill="#6d28d9">감지 → 채널 2 시작</text>
  <path d="M795 228 H865" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="870" y="175" width="145" height="108" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="942" y="208" font-size="16" font-weight="bold" text-anchor="middle" fill="#991b1b">스트립 2</text>
  <text x="942" y="233" font-size="14" text-anchor="middle" fill="#b91c1c">빨간색 점멸</text>
  <text x="942" y="257" font-size="12" text-anchor="middle" fill="#b91c1c">DIN 핀 미정</text>
  <path d="M942 283 V340" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="845" y="345" width="195" height="76" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="942" y="375" font-size="16" font-weight="bold" text-anchor="middle" fill="#166534">끝 IR 2 · D11</text>
  <text x="942" y="399" font-size="13" text-anchor="middle" fill="#15803d">감지 → 채널 2 종료</text>
  <text x="815" y="475" font-size="14" text-anchor="middle" fill="#475569">채널 1 상태와 무관하게 시작·종료</text>

  <!-- shared outputs -->
  <rect x="170" y="560" width="760" height="115" rx="15" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
  <text x="550" y="592" font-size="19" font-weight="bold" text-anchor="middle" fill="#9a3412">공용 경고 출력 — 하나 이상의 채널이 활성일 때</text>
  <text x="550" y="622" font-size="15" text-anchor="middle" fill="#c2410c">빨간 경고 LED(D3): 300ms 점멸 · 수동 부저(D5): 800↔1800Hz 연속 사이렌</text>
  <text x="550" y="650" font-size="13" text-anchor="middle" fill="#9a3412">한 채널이 끝나도 다른 채널이 활성이라면 공용 경고는 계속 유지됩니다.</text>

  <path d="M285 520 V560" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M815 520 V560" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>
