<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" font-family="Malgun Gothic, Noto Sans KR, sans-serif">
  <title>무단횡단 방지 시스템 브레드보드 배선도</title>
  <rect x="0" y="0" width="1000" height="720" fill="#ffffff"/>
  <text x="24" y="40" font-size="24" font-weight="bold" fill="#111827">무단횡단 방지 시스템 — 브레드보드 배선도</text>
  <text x="24" y="66" font-size="14" fill="#4b5563">아두이노 우노 / IR 4 · 네오픽셀 스트립 2 · 부저 · 빨간 LED · 버튼 2 · 외부 전원</text>

  <!-- Arduino board -->
  <rect x="360" y="250" width="250" height="260" rx="10" fill="#0f766e" stroke="#0b5750" stroke-width="2"/>
  <text x="485" y="285" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Arduino UNO</text>
  <text x="485" y="308" font-size="12" fill="#d1fae5" text-anchor="middle">USB / DC 전원</text>

  <!-- digital pin labels on right side of board -->
  <g font-size="13" fill="#ffffff">
    <text x="596" y="340" text-anchor="end">D2</text>
    <text x="596" y="362" text-anchor="end">D3</text>
    <text x="596" y="384" text-anchor="end">D4</text>
    <text x="596" y="406" text-anchor="end">D5</text>
    <text x="596" y="428" text-anchor="end">D6</text>
    <text x="596" y="450" text-anchor="end">D7</text>
  </g>
  <g font-size="13" fill="#ffffff">
    <text x="374" y="340">D8</text>
    <text x="374" y="362">D9</text>
    <text x="374" y="384">D10</text>
    <text x="374" y="406">D11</text>
    <text x="374" y="450">5V</text>
    <text x="374" y="472">GND</text>
  </g>

  <!-- IR sensors -->
  <g>
    <rect x="700" y="120" width="230" height="120" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="815" y="145" font-size="15" font-weight="bold" fill="#312e81" text-anchor="middle">진입 감지 IR 쌍 (인도 → 차도)</text>
    <text x="815" y="172" font-size="13" fill="#3730a3" text-anchor="middle">IR 1 · OUT → D2</text>
    <text x="815" y="194" font-size="13" fill="#3730a3" text-anchor="middle">IR 2 · OUT → D3</text>
    <text x="815" y="220" font-size="12" fill="#6366f1" text-anchor="middle">VCC → 5V · GND → GND</text>
  </g>
  <g>
    <rect x="700" y="270" width="230" height="120" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="815" y="295" font-size="15" font-weight="bold" fill="#312e81" text-anchor="middle">통과 감지 IR 쌍 (반대편 인도)</text>
    <text x="815" y="322" font-size="13" fill="#3730a3" text-anchor="middle">IR 3 · OUT → D4</text>
    <text x="815" y="344" font-size="13" fill="#3730a3" text-anchor="middle">IR 4 · OUT → D5</text>
    <text x="815" y="370" font-size="12" fill="#6366f1" text-anchor="middle">VCC → 5V · GND → GND</text>
  </g>

  <!-- NeoPixel strips -->
  <g>
    <rect x="700" y="420" width="230" height="150" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="815" y="445" font-size="15" font-weight="bold" fill="#7c2d12" text-anchor="middle">네오픽셀 스트립 2개 (차도)</text>
    <text x="815" y="472" font-size="13" fill="#9a3412" text-anchor="middle">스트립 1 · DIN → D6</text>
    <text x="815" y="494" font-size="13" fill="#9a3412" text-anchor="middle">스트립 2 · DIN → D7</text>
    <text x="815" y="520" font-size="12" fill="#c2410c" text-anchor="middle">5V → 외부 전원 +5V</text>
    <text x="815" y="540" font-size="12" fill="#c2410c" text-anchor="middle">GND → 외부 전원 GND</text>
    <text x="815" y="560" font-size="12" font-weight="bold" fill="#b91c1c" text-anchor="middle">+ 아두이노 GND (공통 접지 필수)</text>
  </g>

  <!-- Red LED -->
  <g>
    <rect x="70" y="180" width="230" height="110" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="185" y="205" font-size="15" font-weight="bold" fill="#7f1d1d" text-anchor="middle">빨간색 LED (경고등)</text>
    <text x="185" y="232" font-size="13" fill="#991b1b" text-anchor="middle">D8 → 220~330Ω 저항 → LED (+)</text>
    <text x="185" y="254" font-size="13" fill="#991b1b" text-anchor="middle">LED (−) → GND</text>
    <text x="185" y="276" font-size="12" fill="#ef4444" text-anchor="middle">긴 다리가 (+), 짧은 다리가 (−)</text>
  </g>

  <!-- Buzzer -->
  <g>
    <rect x="70" y="310" width="230" height="90" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="185" y="335" font-size="15" font-weight="bold" fill="#4c1d95" text-anchor="middle">수동(passive) 부저</text>
    <text x="185" y="362" font-size="13" fill="#5b21b6" text-anchor="middle">(+) → D9 · (−) → GND</text>
    <text x="185" y="384" font-size="12" fill="#7c3aed" text-anchor="middle">tone() 사용 — 능동 부저 불가</text>
  </g>

  <!-- Buttons -->
  <g>
    <rect x="70" y="420" width="230" height="120" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="185" y="445" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">버튼 2개 (시연용)</text>
    <text x="185" y="472" font-size="13" fill="#166534" text-anchor="middle">빨강: 한쪽 → D10, 반대쪽 → GND</text>
    <text x="185" y="494" font-size="13" fill="#166534" text-anchor="middle">초록: 한쪽 → D11, 반대쪽 → GND</text>
    <text x="185" y="520" font-size="12" fill="#22c55e" text-anchor="middle">INPUT_PULLUP — 외부 저항 불필요</text>
  </g>

  <!-- External power -->
  <g>
    <rect x="360" y="580" width="250" height="100" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <text x="485" y="605" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">외부 전원 (5V)</text>
    <text x="485" y="630" font-size="12" fill="#334155" text-anchor="middle">보조배터리 또는 9V 건전지 + 레귤레이터</text>
    <text x="485" y="652" font-size="12" fill="#b91c1c" text-anchor="middle">GND는 아두이노 GND와 반드시 연결</text>
    <text x="485" y="672" font-size="12" fill="#334155" text-anchor="middle">스트립 전원을 아두이노 5V에서 뽑지 말 것</text>
  </g>

  <!-- wires -->
  <g stroke-width="2.5" fill="none">
    <path d="M610 336 H700" stroke="#4f46e5"/>
    <path d="M610 358 H660 V180 H700" stroke="#4f46e5"/>
    <path d="M610 380 H700" stroke="#4f46e5"/>
    <path d="M610 402 H660 V330 H700" stroke="#4f46e5"/>
    <path d="M610 424 H680 V468 H700" stroke="#ea580c"/>
    <path d="M610 446 H670 V490 H700" stroke="#ea580c"/>
    <path d="M360 336 H330 V228 H300" stroke="#dc2626"/>
    <path d="M360 358 H320 V358 H300" stroke="#7c3aed"/>
    <path d="M360 380 H340 V468 H300" stroke="#16a34a"/>
    <path d="M360 402 H350 V490 H300" stroke="#16a34a"/>
    <path d="M400 510 V580" stroke="#334155"/>
    <path d="M700 555 H640 V620 H610" stroke="#b91c1c" stroke-dasharray="6 5"/>
  </g>

  <text x="24" y="700" font-size="12" fill="#6b7280">핀 배정은 README.md "5. 핀 연결표" 및 main.ino 상단 상수와 동일합니다. 핀을 바꾸면 세 곳을 함께 수정하세요.</text>
</svg>
