<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" font-family="Malgun Gothic, Noto Sans KR, sans-serif">
  <title>멈춰 ! 독립 채널 배선도</title>
  <rect width="1200" height="820" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
  </defs>

  <text x="34" y="48" font-size="28" font-weight="bold" fill="#111827">멈춰 ! — 돌발 보행자 감지 및 경고 시스템 배선도</text>
  <text x="34" y="78" font-size="15" fill="#475569">채널 1: D8 시작 / D10 끝 / D4 스트립 · 채널 2: D9 시작 / D11 끝 / 스트립2 핀 미정</text>

  <!-- Arduino -->
  <rect x="455" y="180" width="290" height="455" rx="16" fill="#0f766e" stroke="#115e59" stroke-width="3"/>
  <text x="600" y="220" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">Arduino UNO</text>
  <g font-size="15" fill="#ffffff">
    <text x="480" y="285">D3 · 공용 LED</text>
    <text x="480" y="320">D4 · 스트립 1</text>
    <text x="480" y="355">D5 · 공용 부저</text>
    <text x="480" y="390">D8 · 시작 IR 1</text>
    <text x="480" y="425">D9 · 시작 IR 2</text>
    <text x="480" y="460">D10 · 끝 IR 1</text>
    <text x="480" y="495">D11 · 끝 IR 2</text>
    <text x="480" y="530">A0 · 전체 시작</text>
    <text x="480" y="565">A1 · 전체 종료</text>
    <text x="480" y="600">5V / GND · 공통 전원</text>
  </g>

  <!-- channel 1 -->
  <rect x="40" y="135" width="350" height="310" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="215" y="170" font-size="21" font-weight="bold" text-anchor="middle" fill="#1e3a8a">채널 1 세트</text>
  <rect x="75" y="205" width="280" height="58" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="215" y="240" font-size="16" text-anchor="middle" fill="#1e40af">시작 IR 1 OUT → D8</text>
  <rect x="75" y="285" width="280" height="58" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="215" y="320" font-size="16" text-anchor="middle" fill="#991b1b">스트립 1 DIN → D4</text>
  <rect x="75" y="365" width="280" height="58" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="215" y="400" font-size="16" text-anchor="middle" fill="#166534">끝 IR 1 OUT → D10</text>
  <text x="215" y="438" font-size="12" text-anchor="middle" fill="#475569">D8 감지부터 D10 감지까지 스트립 1만 점멸</text>

  <!-- channel 2 -->
  <rect x="810" y="135" width="350" height="310" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
  <text x="985" y="170" font-size="21" font-weight="bold" text-anchor="middle" fill="#5b21b6">채널 2 세트</text>
  <rect x="845" y="205" width="280" height="58" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="985" y="240" font-size="16" text-anchor="middle" fill="#5b21b6">시작 IR 2 OUT → D9</text>
  <rect x="845" y="285" width="280" height="70" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="985" y="315" font-size="16" text-anchor="middle" fill="#991b1b">스트립 2 DIN → 미정</text>
  <text x="985" y="339" font-size="12" text-anchor="middle" fill="#b91c1c">PIN_STRIP_2=0이면 출력 건너뜀</text>
  <rect x="845" y="375" width="280" height="58" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="985" y="410" font-size="16" text-anchor="middle" fill="#166534">끝 IR 2 OUT → D11</text>
  <text x="985" y="450" font-size="12" text-anchor="middle" fill="#475569">D9 감지부터 D11 감지까지 스트립 2만 점멸</text>

  <!-- shared -->
  <rect x="55" y="505" width="330" height="185" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <text x="220" y="540" font-size="19" font-weight="bold" text-anchor="middle" fill="#9a3412">공용 경고 출력</text>
  <text x="85" y="575" font-size="15" fill="#9a3412">빨간 LED: D3 → 220~330Ω → GND</text>
  <text x="85" y="608" font-size="15" fill="#9a3412">수동 부저: (+) D5 / (−) GND</text>
  <text x="85" y="641" font-size="13" fill="#c2410c">하나 이상의 채널 활성 시 계속 경고</text>
  <text x="85" y="668" font-size="13" fill="#c2410c">LED 점멸 · 부저 연속 사이렌</text>

  <rect x="815" y="505" width="330" height="185" rx="14" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
  <text x="980" y="540" font-size="19" font-weight="bold" text-anchor="middle" fill="#0f172a">수동 버튼</text>
  <text x="845" y="578" font-size="15" fill="#991b1b">빨간 버튼: A0 ↔ GND</text>
  <text x="845" y="607" font-size="13" fill="#475569">→ 두 채널 수동 시작</text>
  <text x="845" y="642" font-size="15" fill="#166534">초록 버튼: A1 ↔ GND</text>
  <text x="845" y="671" font-size="13" fill="#475569">→ 두 채널 수동 종료</text>

  <!-- power -->
  <rect x="430" y="675" width="340" height="105" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="600" y="710" font-size="18" font-weight="bold" text-anchor="middle" fill="#0f172a">5V 외부 전원</text>
  <text x="600" y="740" font-size="13" text-anchor="middle" fill="#334155">스트립 5V/GND · IR VCC/GND</text>
  <text x="600" y="765" font-size="13" font-weight="bold" text-anchor="middle" fill="#b91c1c">Arduino GND와 반드시 공통 접지</text>

  <path d="M390 314 H455" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M810 320 H745" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M600 635 V675" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="34" y="808" font-size="12" fill="#64748b">※ 스트립 2 실제 DIN 핀은 아직 확정하지 않았습니다. 자동 테스트의 임시 핀 값은 실제 배선 결정으로 간주하지 마세요.</text>
</svg>
